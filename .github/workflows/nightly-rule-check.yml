name: Nightly Rule Check

on:
  schedule:
    # 日本時間 毎朝5時（UTC 20時）に実行
    - cron: '0 20 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  check-new-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and notify new rules
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 前回のチェック日時を読み込む
          LAST_CHECK=$(cat .cache/last_check.json 2>/dev/null | jq -r '.last_check' || echo "2020-01-01T00:00:00Z")
          echo "Last check: $LAST_CHECK"

          # 前回チェック以降に更新された .md ファイルを探す
          NEW_FILES=$(git log --since="$LAST_CHECK" --diff-filter=AM --name-only --pretty=format: -- '*.md' | grep -v 'node_modules' | sort -u)

          if [ -z "$NEW_FILES" ]; then
            echo "No new/modified .md files found."
          else
            echo "New/modified .md files:"
            echo "$NEW_FILES"

            # Discordに通知
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"content\": \"📋 **新着/更新ルールファイルのお知らせ**\\n\\n以下の .md ファイルが更新されました：\\n\\n\`\`\`\\n${NEW_FILES}\\n\`\`\`\\n\\n分析Botに \`!reload\` を送って学習させてください！\"
              }"
          fi

          # 最終チェック日時を更新
          echo "{\"last_check\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .cache/last_check.json
          git config user.name "SEO Bot"
          git config user.email "seobot@example.com"
          git add .cache/last_check.json
          git commit -m "Update last check timestamp" || true
          git push || true
