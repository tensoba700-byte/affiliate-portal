name: Nightly Rule Check

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  check-new-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and notify new rules
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          LAST_CHECK=$(cat .cache/last_check.json 2>/dev/null | jq -r '.last_check' || echo "2020-01-01T00:00:00Z")
          echo "Last check: $LAST_CHECK"

          NEW_FILES=$(git log --since="$LAST_CHECK" --diff-filter=AM --name-only --pretty=format: -- '*.md' | grep -v 'node_modules' | sort -u)

          if [ -z "$NEW_FILES" ]; then
            echo "No new/modified .md files found."
          else
            echo "New/modified .md files:"
            echo "$NEW_FILES"

            # Discordに通知（日本語ファイル名があっても安全な方法）
            echo "📋 **新着/更新ルールファイルのお知らせ**" > /tmp/message.txt
            echo "" >> /tmp/message.txt
            echo "以下の .md ファイルが更新されました：" >> /tmp/message.txt
            echo "\`\`\`" >> /tmp/message.txt
            echo "$NEW_FILES" >> /tmp/message.txt
            echo "\`\`\`" >> /tmp/message.txt
            echo "" >> /tmp/message.txt
            echo "分析Botに \`!reload\` を送って学習させてください！" >> /tmp/message.txt

            # jqを使って安全にJSONを生成して送信
            jq -Rs '{content: .}' /tmp/message.txt | curl -s -o /dev/null -w "%{http_code}" -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-
            echo ""
            echo "Discord通知を送信しました"
          fi

          echo "{\"last_check\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > .cache/last_check.json
          git config user.name "SEO Bot"
          git config user.email "seobot@example.com"
          git add .cache/last_check.json
          git commit -m "Update last check timestamp" || true
          git push || true
