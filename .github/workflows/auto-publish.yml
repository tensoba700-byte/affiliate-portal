name: Auto Publish to Note

on:
  schedule:
    - cron: '30 3 * * *' # Runs at 03:30 UTC (12:30 JST) every day, 30 min after 12:00 JST column release
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  post-to-note:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure playwright and python-dotenv are installed
          pip install playwright python-dotenv

      - name: Install Playwright Chromium and dependencies
        run: |
          playwright install chromium
          # Install browser dependencies for Ubuntu environment
          playwright install-deps chromium

      - name: Run note auto-post script
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        run: |
          python scripts/note_auto_post.py
