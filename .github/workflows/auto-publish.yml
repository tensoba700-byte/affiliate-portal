name: Auto Publish Articles

on:
#  schedule:
#    # 朝5時 JST（遅延考慮で7時頃に投稿される想定）
#    - cron: '0 20 * * *'
#    # 夜18時 JST（遅延考慮で21時頃に投稿される想定）
#    - cron: '0 9 * * *'
  workflow_dispatch: {}    # 手動実行も可能


jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js (for eyecatch screenshot)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci --prefer-offline || npm install

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai python-dotenv

      - name: Run auto-publish script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          echo "NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}" > .env.local
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env.local
          echo "NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}" >> .env.local
          
          # 1. まず Notion 競合記事キューから「未処理」のものがあるか探し、処理を試みる
          python scripts/process_competitor_queue.py
          EXIT_CODE=$?
          
          # 2. 終了コードが 2（キューが空、またはデータベース未設定）の場合は、フォールバックとして従来のバッチスクリプトを走らせる
          if [ $EXIT_CODE -eq 2 ]; then
            echo "💡 Notion queue is empty or database not found. Falling back to default batch article generation..."
            python scripts/auto_publish_batch.py
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Notion queue process failed with exit code $EXIT_CODE."
            exit $EXIT_CODE
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/content/articles public/eyecatch public/sitemap.xml public/sitemap-0.xml
          git diff --staged --quiet || git commit -m "chore: auto-publish article [skip ci]"
          git push origin main || echo "No changes to push"
