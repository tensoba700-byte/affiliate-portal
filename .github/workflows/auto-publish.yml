name: Auto Publish Articles

on:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST
    - cron: '0 11 * * *' # 20:00 JST
  workflow_dispatch:
    inputs:
      time_window:
        description: 'Time window to process'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - night

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai python-dotenv

      - name: Determine time window
        id: determine_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "window=${{ github.event.inputs.time_window }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "22" ] || [ "$HOUR" = "21" ]; then
              echo "window=morning" >> $GITHUB_OUTPUT
            else
              echo "window=night" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run auto-publish script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          # Create a dummy .env.local for the script to load
          echo "NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}" > .env.local
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env.local
          echo "NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}" >> .env.local
          python scripts/auto_publish_batch.py --time ${{ steps.determine_time.outputs.window }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/content/articles public/eyecatch
          git commit -m "chore: auto-publish article [skip ci]" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
