name: Auto Publish Articles

on:
  schedule:
    - cron: '0 22 * * *'  # 07:00 JST (UTC+9) — 朝の投稿
    - cron: '0 12 * * *'  # 21:00 JST (UTC+9) — 夜の投稿
  workflow_dispatch: {}    # 手動実行も可能

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js (for eyecatch screenshot)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci --prefer-offline || npm install

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai python-dotenv

      - name: Run auto-publish script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          echo "NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}" > .env.local
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env.local
          echo "NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}" >> .env.local
          python scripts/auto_publish_batch.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/content/articles public/eyecatch
          git diff --staged --quiet || git commit -m "chore: auto-publish article [skip ci]"
          git push origin main || echo "No changes to push"
