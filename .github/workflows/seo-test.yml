name: SEOアドバイス（テスト）

on:
  issues:
    types: [opened]

jobs:
  seo-advice:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: GeminiにSEOアドバイスをもらう
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        run: |
          npm install -g @google/gemini-cli
          
          gemini -p "
          あなたはSEOの専門家です。
          次の記事に対して、3つだけ改善アドバイスをください。
          記事は一切修正せず、アドバイスだけを出力してください。
          
          【記事】
          ${{ github.event.issue.body }}
          " > advice.md
          
          cat advice.md >> $GITHUB_STEP_SUMMARY

      - name: Issueにアドバイスを返信
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const advice = fs.readFileSync('advice.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: advice
            });
