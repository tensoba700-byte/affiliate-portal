name: Morning Planning

on:
  schedule:
    - cron: '0 21 * * *'  # 06:00 JST (UTC+9) — 毎朝6時に自動実行
  workflow_dispatch: {}    # 手動実行も可能

jobs:
  morning-planning:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # Notion書き込みのみなのでread権限で十分

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run morning planning script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          # CI環境用の .env.local を生成
          echo "NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}" > .env.local
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env.local
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> .env.local
          echo "TARGET_CHANNEL_ID=${{ secrets.TARGET_CHANNEL_ID }}" >> .env.local
          echo "NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}" >> .env.local
          echo "RAKUTEN_APP_ID=${{ secrets.RAKUTEN_APP_ID }}" >> .env.local
          echo "RAKUTEN_ACCESS_KEY=${{ secrets.RAKUTEN_ACCESS_KEY }}" >> .env.local
          python scripts/morning_suggestion_discord.py
