<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>髪に、さらなる極上の潤いを。【速乾と美髪を叶えるヘアドライヤー6選】</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1200px;
      height: 630px;
      background-color: #ffffff;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      position: relative;
      overflow: hidden;
    }
    /* 画像グリッド */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      width: 100%;
      height: 100%;
      padding: 40px;
      gap: 30px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .grid-item {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 10px;
    }
    .grid-item img {
      max-width: 100%;
      max-height: 220px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }
    /* 中央のテキストオーバーレイ */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      text-align: center;
    }
    .title-box {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 35px 50px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(10px);
      max-width: 85%;
    }
    .main-title {
      font-size: 58px;
      font-weight: 900;
      color: #2c2c2c;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }
    .sub-title {
      font-size: 26px;
      font-weight: 800;
      color: #7d7d7d;
      margin-top: 15px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- 背後の商品画像グリッド -->
  <div class="grid">
    <div class="grid-item">
      <img src="https://item-shopping.c.yimg.jp/i/l/hotmeteor_b0cjxn9w6w-a1d84ez37got0-20260504" alt="パナソニック イオニティ EH-NE7L-P">
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1620061698155-4167f092deb8?w=500" alt="ドンキ ソクドラ">
    </div>
    <div class="grid-item">
      <img src="https://item-shopping.c.yimg.jp/i/l/nailcol_n10018125" alt="モッズ・ヘア">
    </div>
    <div class="grid-item">
      <img src="https://item-shopping.c.yimg.jp/i/l/mi-naone_meena3ac1e83a00" alt="パナソニック イオニティ EH-NE4J-N">
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1585751119414-ef2636f8aedf?w=500" alt="ヤマダオリジナル">
    </div>
    <div class="grid-item">
      <img src="https://item-shopping.c.yimg.jp/i/l/zozo_99225564" alt="サロニア スムースシャイン">
    </div>
  </div>

  <!-- 中央のテキスト -->
  <div class="overlay">
    <div class="title-box">
      <h1 class="main-title">
        髪に、さらなる<br>極上の潤いを。
      </h1>
      <div class="sub-title">【速乾と美髪を叶えるヘアドライヤー6選】</div>
    </div>
  </div>

</body>
</html>
