<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>突然の雨にも、スマートな備えを。【軽量で濡れない折りたたみ傘6選】</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1200px;
      height: 630px;
      background-color: #ffffff;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      position: relative;
      overflow: hidden;
    }
    /* 画像グリッド */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      width: 100%;
      height: 100%;
      padding: 40px;
      gap: 30px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .grid-item {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 10px;
    }
    .grid-item img {
      max-width: 100%;
      max-height: 220px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }
    /* 中央のテキストオーバーレイ */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      text-align: center;
    }
    .title-box {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 35px 50px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(10px);
      max-width: 85%;
    }
    .main-title {
      font-size: 58px;
      font-weight: 900;
      color: #2c2c2c;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }
    .sub-title {
      font-size: 26px;
      font-weight: 800;
      color: #7d7d7d;
      margin-top: 15px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- 背後の商品画像グリッド -->
  <div class="grid">
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1517487881594-2787fef5ebf7?w=500" alt="セブン 自動開閉">
    </div>
    <div class="grid-item">
      <img src="https://item-shopping.c.yimg.jp/i/l/shiningstore_ab-2206386" alt="Waterfront ポケフラット">
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1501004318641-724e638448a3?w=500" alt="セブン 軽ブレラ">
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1492011221367-f47e3ccd77a0?w=500" alt="Davek MINI">
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1428908728789-d2de25dbd4e2?w=500" alt="無印良品 2通り">
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1485594050903-8e8ee7b071a8?w=500" alt="ユニクロ コンパクトアンブレラ">
    </div>
  </div>

  <!-- 中央のテキスト -->
  <div class="overlay">
    <div class="title-box">
      <h1 class="main-title">
        突然の雨にも、<br>スマートな備えを。
      </h1>
      <div class="sub-title">【軽量で濡れない折りたたみ傘6選】</div>
    </div>
  </div>

</body>
</html>
