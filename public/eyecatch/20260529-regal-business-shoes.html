<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>風格と信頼を、足元に。【ビジネスマンを支えるリーガルの革靴6選】</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1200px;
      height: 630px;
      background-color: #ffffff;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      position: relative;
      overflow: hidden;
    }
    /* 画像グリッド */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      width: 100%;
      height: 100%;
      padding: 40px;
      gap: 30px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .grid-item {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }
    .grid-item img {
      max-width: 100%;
      max-height: 220px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }
    /* 中央のテキストオーバーレイ */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      text-align: center;
    }
    .title-box {
      background-color: rgba(255, 255, 255, 0.65);
      padding: 35px 50px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(10px);
      max-width: 85%;
    }
    .main-title {
      font-size: 58px;
      font-weight: 900;
      color: #2c2c2c;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }
    .sub-title {
      font-size: 26px;
      font-weight: 800;
      color: #7d7d7d;
      margin-top: 15px;
      letter-spacing: 0.05em;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- 背後の商品画像グリッド -->
  <div class="grid">
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1533867617858-e7b97e060509?w=500" alt="REGAL 315R">
    </div>
    <div class="grid-item">
      <img src="https://item-shopping.c.yimg.jp/i/l/a-one1_regal-21vrbc-bl" alt="REGAL 21VRBC">
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500" alt="REGAL 725RAL">
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1486308512493-ae6a8bfdbeac?w=500" alt="REGAL 01DRCD">
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=500" alt="REGAL 230S">
    </div>
    <div class="grid-item">
      <img src="https://images.unsplash.com/photo-1520639888713-7851133b1ed0?w=500" alt="REGAL 2589N">
    </div>
  </div>

  <!-- 中央のテキスト -->
  <div class="overlay">
    <div class="title-box">
      <h1 class="main-title">
        風格と信頼を、<br>足元に。
      </h1>
      <div class="sub-title">【ビジネスマンを支える<br>リーガルの革靴6選】</div>
    </div>
  </div>

</body>
</html>
